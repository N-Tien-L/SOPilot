# SOPilot V2 local infrastructure (ADR-004 §4.4, ticket V2-08).
# Separate compose project and volumes: never touches the legacy stack in docker-compose.yml.
#   docker compose -f docker-compose.v2.yml up -d
# Secrets come from .env (see the "V2" block in .env.example). Never run `down -v` on this project.
name: sopilot-v2

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: sopilot-v2-postgres
    environment:
      POSTGRES_DB: sopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${V2_POSTGRES_SUPERUSER_PASSWORD:?set V2_POSTGRES_SUPERUSER_PASSWORD in .env}
      V2_DB_MIGRATOR_PASSWORD: ${V2_DB_MIGRATOR_PASSWORD:?set V2_DB_MIGRATOR_PASSWORD in .env}
      V2_DB_CORE_APP_PASSWORD: ${V2_DB_CORE_APP_PASSWORD:?set V2_DB_CORE_APP_PASSWORD in .env}
      V2_DB_AI_APP_PASSWORD: ${V2_DB_AI_APP_PASSWORD:?set V2_DB_AI_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${V2_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sopilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sopilot-v2]

  flyway-core:
    image: flyway/flyway:10.20.1-alpine
    container_name: sopilot-v2-flyway-core
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/sopilot
      FLYWAY_USER: sopilot_migrator
      FLYWAY_PASSWORD: ${V2_DB_MIGRATOR_PASSWORD}
      FLYWAY_SCHEMAS: core
      FLYWAY_DEFAULT_SCHEMA: core
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./infrastructure/db/migrations/core:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [sopilot-v2]

  flyway-rag:
    image: flyway/flyway:10.20.1-alpine
    container_name: sopilot-v2-flyway-rag
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/sopilot
      FLYWAY_USER: sopilot_migrator
      FLYWAY_PASSWORD: ${V2_DB_MIGRATOR_PASSWORD}
      FLYWAY_SCHEMAS: rag
      FLYWAY_DEFAULT_SCHEMA: rag
      FLYWAY_TABLE: flyway_schema_history
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./infrastructure/db/migrations/rag:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [sopilot-v2]

  minio:
    # MinIO community is archived (ADR-006); this release is pinned and only used locally/CI.
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sopilot-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${V2_MINIO_ROOT_USER:?set V2_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${V2_MINIO_ROOT_PASSWORD:?set V2_MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${V2_MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${V2_MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sopilot-v2]

  minio-init:
    # One-shot: bucket + least-privilege users (core-api read/write, ai-service read-only).
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sopilot-v2-minio-init
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${V2_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${V2_MINIO_ROOT_PASSWORD}
      SOPILOT_S3_BUCKET: ${SOPILOT_S3_BUCKET:-sopilot-v2-documents}
      SOPILOT_S3_ACCESS_KEY: ${SOPILOT_S3_ACCESS_KEY:?set SOPILOT_S3_ACCESS_KEY in .env}
      SOPILOT_S3_SECRET_KEY: ${SOPILOT_S3_SECRET_KEY:?set SOPILOT_S3_SECRET_KEY in .env}
      SOPILOT_S3_AI_ACCESS_KEY: ${SOPILOT_S3_AI_ACCESS_KEY:?set SOPILOT_S3_AI_ACCESS_KEY in .env}
      SOPILOT_S3_AI_SECRET_KEY: ${SOPILOT_S3_AI_SECRET_KEY:?set SOPILOT_S3_AI_SECRET_KEY in .env}
    volumes:
      - ./infrastructure/storage:/init:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [sopilot-v2]

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: sopilot-v2-core-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      SOPILOT_DB_URL: jdbc:postgresql://postgres:5432/sopilot
      SOPILOT_DB_USER: sopilot_core_app
      SOPILOT_DB_PASSWORD: ${V2_DB_CORE_APP_PASSWORD}
      SOPILOT_S3_ENDPOINT: http://minio:9000
      SOPILOT_S3_BUCKET: ${SOPILOT_S3_BUCKET:-sopilot-v2-documents}
      SOPILOT_S3_ACCESS_KEY: ${SOPILOT_S3_ACCESS_KEY}
      SOPILOT_S3_SECRET_KEY: ${SOPILOT_S3_SECRET_KEY}
      SOPILOT_AI_BASE_URL: http://ai-service:8000
      SOPILOT_INTERNAL_TOKEN: ${SOPILOT_INTERNAL_TOKEN:?set SOPILOT_INTERNAL_TOKEN in .env (see root .env.example)}
      SOPILOT_FRONTEND_ORIGIN: ${SOPILOT_FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${V2_CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway-core:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [sopilot-v2]

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: sopilot-v2-ai-service
    environment:
      SOPILOT_PROFILE: local
      SOPILOT_DB_URL: postgresql://sopilot_ai_app:${V2_DB_AI_APP_PASSWORD}@postgres:5432/sopilot
      SOPILOT_INTERNAL_TOKEN: ${SOPILOT_INTERNAL_TOKEN:?set SOPILOT_INTERNAL_TOKEN in .env (see root .env.example)}
      SOPILOT_CORE_BASE_URL: http://core-api:8080
      SOPILOT_CORE_JWKS_URL: http://core-api:8080/.well-known/jwks.json
      SOPILOT_S3_ENDPOINT: minio:9000
      SOPILOT_S3_SECURE: "false"
      SOPILOT_S3_BUCKET: ${SOPILOT_S3_BUCKET:-sopilot-v2-documents}
      SOPILOT_S3_AI_ACCESS_KEY: ${SOPILOT_S3_AI_ACCESS_KEY}
      SOPILOT_S3_AI_SECRET_KEY: ${SOPILOT_S3_AI_SECRET_KEY}
      SOPILOT_LLM_BASE_URL: ${SOPILOT_LLM_BASE_URL:?set SOPILOT_LLM_BASE_URL in .env (Modal endpoint with /v1)}
      SOPILOT_LLM_MODEL: ${SOPILOT_LLM_MODEL:-Qwen/Qwen3.5-9B}
      SOPILOT_LLM_API_KEY: ${SOPILOT_LLM_API_KEY:?set SOPILOT_LLM_API_KEY in .env (same as Modal VLLM_API_KEY)}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
    ports:
      - "127.0.0.1:${V2_AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      flyway-rag:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks: [sopilot-v2]

  ai-worker:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: sopilot-v2-ai-worker
    command: ["python", "-m", "sopilot_ai.worker"]
    environment:
      SOPILOT_PROFILE: local
      SOPILOT_DB_URL: postgresql://sopilot_ai_app:${V2_DB_AI_APP_PASSWORD}@postgres:5432/sopilot
      SOPILOT_INTERNAL_TOKEN: ${SOPILOT_INTERNAL_TOKEN:?set SOPILOT_INTERNAL_TOKEN in .env (see root .env.example)}
      SOPILOT_CORE_BASE_URL: http://core-api:8080
      SOPILOT_CORE_JWKS_URL: http://core-api:8080/.well-known/jwks.json
      SOPILOT_S3_ENDPOINT: minio:9000
      SOPILOT_S3_SECURE: "false"
      SOPILOT_S3_BUCKET: ${SOPILOT_S3_BUCKET:-sopilot-v2-documents}
      SOPILOT_S3_AI_ACCESS_KEY: ${SOPILOT_S3_AI_ACCESS_KEY}
      SOPILOT_S3_AI_SECRET_KEY: ${SOPILOT_S3_AI_SECRET_KEY}
      SOPILOT_LLM_BASE_URL: ${SOPILOT_LLM_BASE_URL:?set SOPILOT_LLM_BASE_URL in .env (Modal endpoint with /v1)}
      SOPILOT_LLM_MODEL: ${SOPILOT_LLM_MODEL:-Qwen/Qwen3.5-9B}
      SOPILOT_LLM_API_KEY: ${SOPILOT_LLM_API_KEY:?set SOPILOT_LLM_API_KEY in .env (same as Modal VLLM_API_KEY)}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      # V2-25 metadata suggestions. Optional: without it suggestions fall back to RULES_FALLBACK.
      SOPILOT_GROQ_API_KEY: ${SOPILOT_GROQ_API_KEY:-}
    # The worker has no HTTP server; the image's curl :8000 HEALTHCHECK would always fail.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      flyway-rag:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    networks: [sopilot-v2]

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${V2_CORE_API_PORT:-8080}
    container_name: sopilot-v2-web
    ports:
      - "127.0.0.1:${V2_WEB_PORT:-3000}:3000"
    depends_on:
      core-api:
        condition: service_healthy
    networks: [sopilot-v2]

volumes:
  postgres_data:
  minio_data:

networks:
  sopilot-v2:
    name: sopilot-v2-network
