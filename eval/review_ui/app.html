<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOPilot · Duyệt V2-06 / V2-19</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1b2230;--muted:#5f6b7d;--line:#dde1e8;--soft:#eef1f5;
 --accent:#2457d6;--accent-bg:#e7eefc;--ok:#18794a;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe9e8;
 --warn:#8a5a00;--warn-bg:#fff2d2;--hl:#ffe58a;--hl2:#ffd0a8;--hl3:#c8e6ff;--hl4:#d9f2c4;--faint:#eceff3}
@media (prefers-color-scheme:dark){:root{--bg:#13161c;--panel:#1c2129;--ink:#e7eaf0;--muted:#98a2b3;--line:#2d3440;--soft:#232a34;
 --accent:#7da3ff;--accent-bg:#1f2a44;--ok:#5fd08f;--ok-bg:#16301f;--bad:#ff8f87;--bad-bg:#3a1c1a;--warn:#ffc766;--warn-bg:#3a2f12;
 --hl:#6b5a12;--hl2:#6b3d18;--hl3:#163f63;--hl4:#2c4a1c;--faint:#262c36}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:1px 7px;font-size:12px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--panel)}
textarea{width:100%;resize:vertical}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--soft)}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0}
header .tabs a{padding:5px 12px;border-radius:6px;text-decoration:none;color:var(--ink)}
header .tabs a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.spacer{flex:1}
a{color:var(--accent)}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.acc{background:var(--accent-bg);color:var(--accent);border-color:transparent}
main{flex:1;min-height:0;display:flex}
.side{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.side .item{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:block;color:inherit;text-decoration:none}
.side .item:hover{background:var(--soft)}
.side .item.on{background:var(--accent-bg)}
.side .item .t{font-weight:600;font-size:13px}
.side .item .m{font-size:12px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.side .grp{padding:8px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
.side .tools{padding:8px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.reviewed{background:var(--ok)}.dot.excluded{background:var(--bad)}.dot.draft{background:#9aa3b2}.dot.wip{background:#e0a100}
.col{overflow:auto;min-width:0}
.pane{padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;user-select:none;background:var(--panel)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.status-reviewed{border-left:4px solid var(--ok)}.status-draft{border-left:4px solid #9aa3b2}.status-excluded{border-left:4px solid var(--bad)}
.eset{border:1px dashed var(--line);border-radius:8px;padding:8px;margin:6px 0}
.eset .hd{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:5px}
.span{border-radius:6px;padding:6px 8px;margin:4px 0;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.span .q{flex:1;font-size:13px}
.span .id{font:11px ui-monospace,monospace;color:var(--muted)}
.c0{background:var(--hl)}.c1{background:var(--hl2)}.c2{background:var(--hl3)}.c3{background:var(--hl4)}
.viewer{display:flex;flex-direction:column;height:100%}
.vbar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.vtext{flex:1;overflow:auto;padding:12px 16px;background:var(--panel)}
.vtext pre{white-space:pre-wrap;word-break:break-word;font:13.5px/1.6 "Segoe UI",system-ui,sans-serif;margin:0}
.vtext pre .o{background:var(--faint);border-radius:2px}
.vtext pre .page-mark{display:block;font:11px ui-monospace,monospace;color:var(--accent);border-top:1px solid var(--line);margin-top:6px;padding-top:2px}
.vimg{flex:1;overflow:auto;background:var(--soft);border-top:1px solid var(--line);text-align:center;min-height:0}
.vimg img{max-width:100%;display:block;margin:0 auto;background:#fff}
.vimg img.zoom{max-width:none;width:160%}
.selbar{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:5px;flex-wrap:wrap;max-width:520px}
.results{max-height:40vh;overflow:auto;border-bottom:1px solid var(--line);background:var(--panel)}
.results .r{padding:6px 12px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.results .r:hover{background:var(--soft)}
.results mark{background:var(--hl)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;max-width:80vw}
.toast.err{background:var(--bad);color:#fff}
.home{max-width:980px;margin:30px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.home .card{padding:18px}
.home a.card{color:inherit;text-decoration:none;display:block}
.home a.card:hover{border-color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--ok)}
.pages{display:flex;gap:3px;flex-wrap:wrap}
.pages button{min-width:30px;padding:2px 6px;font-size:12px;position:relative}
.pages button.cur{outline:2px solid var(--accent)}
.pages button.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pages button .n{position:absolute;top:-6px;right:-5px;font-size:9px;background:var(--accent);color:#fff;border-radius:99px;padding:0 4px}
.lab{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:5px 0;background:var(--panel)}
.lab.d-ok{border-color:var(--ok);background:var(--ok-bg)}
.lab.d-edit{border-color:var(--warn);background:var(--warn-bg)}
.lab.d-reject{border-color:var(--bad);background:var(--bad-bg)}
.lab.d-reject .body{text-decoration:line-through;opacity:.6}
.lab .acts{display:flex;gap:3px;float:right;margin-left:6px}
.lab .body{font-size:13px}
.lab .edit{margin-top:6px;display:grid;grid-template-columns:90px 1fr;gap:4px 8px;align-items:center;font-size:12px}
.lab .edit input,.lab .edit select,.lab .edit textarea{font-size:12.5px;padding:2px 6px}
.sec{margin:12px 0 4px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.notes{white-space:pre-wrap;font-size:12.5px;max-height:220px;overflow:auto;background:var(--soft);border-radius:8px;padding:8px}
.notes mark{background:var(--warn-bg);color:var(--warn);font-weight:600}
.footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.help{font-size:12px;color:var(--muted)}
.md{white-space:pre-wrap;font:13px/1.55 ui-monospace,Consolas,monospace;padding:16px;text-align:left;background:var(--panel);margin:0}
</style>
</head>
<body>
<header>
  <h1>SOPilot · Duyệt nhãn</h1>
  <nav class="tabs"><a href="#/" id="tab-home">Tổng quan</a><a href="#/v206" id="tab-v206">V2-06 Câu hỏi</a><a href="#/v219" id="tab-v219">V2-19 Trích xuất PDF</a></nav>
  <span class="spacer"></span>
  <span id="vbadges" class="row"></span>
  <label class="small muted">Người duyệt <input id="reviewer" size="14"></label>
</header>
<main id="main"></main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QT = ["fact","procedure","condition_exception","number_deadline","responsibility","comparison","multi_passage"];
const QT_VI = {fact:"sự kiện",procedure:"quy trình",condition_exception:"điều kiện/ngoại lệ",number_deadline:"số liệu/hạn",responsibility:"trách nhiệm",comparison:"so sánh",multi_passage:"nhiều đoạn"};
const S = {v206: null, v219: null, route: [], ui: {}};
const reviewerEl = $("#reviewer");
reviewerEl.value = localStorage.getItem("sopilot.reviewer") || "owner:tiên";
reviewerEl.onchange = () => localStorage.setItem("sopilot.reviewer", reviewerEl.value.trim());
const reviewer = () => reviewerEl.value.trim();

function toast(msg, err) {
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 1800);
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok || j.error) { toast(j.error || r.statusText, true); throw new Error(j.error); }
  return j;
}
const inField = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);

function badges(v, label) {
  if (!v) return "";
  const b = (x, name, okText, badText) => `<span class="badge ${x.ok ? "ok" : "bad"}" title="${esc(x.error || "")}">${name}: ${x.ok ? okText : badText}</span>`;
  return `<span class="small muted">${label}</span>` + b(v.structure, "cấu trúc", "hợp lệ", "lỗi") + b(v.gate, "gate --require-reviewed", "xanh", "chưa");
}
function renderBadges() {
  const r = S.route[0];
  const v = r === "v206" ? S.v206?.validation : r === "v219" ? S.v219?.validation : null;
  $("#vbadges").innerHTML = v ? badges(v, r === "v206" ? "V2-06" : "V2-19") : "";
}

// ======================================================================== routing
async function route() {
  S.route = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  for (const id of ["home", "v206", "v219"]) $("#tab-" + id).classList.toggle("on", (S.route[0] || "home") === id);
  const r = S.route[0];
  if (r === "v206") { if (!S.v206) await loadV206(); renderV206(); }
  else if (r === "v219") { if (!S.v219) await loadV219(); renderV219(); }
  else { await Promise.all([loadV206(), loadV219()]); renderHome(); }
  renderBadges();
}
window.addEventListener("hashchange", route);

// ======================================================================== home
function v206Progress() {
  const qs = S.v206.questions, ex = S.v206.excluded;
  const done = qs.filter(q => q.review_status === "reviewed").length + ex.length;
  return {done, total: qs.length + ex.length, reviewed: qs.length - qs.filter(q => q.review_status !== "reviewed").length, excluded: ex.length};
}
function v219Owner(rec) { return rec.owner_confirmed === "full_document"; }
function renderHome() {
  const p6 = v206Progress();
  const anns = S.v219.annotations, own = anns.filter(v219Owner).length, wip = Object.keys(S.v219.drafts).length;
  $("#main").innerHTML = `<div class="col" style="flex:1"><div class="home">
   <a class="card" href="#/v206"><h3>V2-06 · Câu hỏi đa ngôn ngữ</h3>
     <div class="muted small">${S.v206.manifest.corpus_version} · ${S.v206.manifest.documents.length} tài liệu · ${S.v206.spans.length} span</div>
     <div class="bar"><i style="width:${100 * p6.done / Math.max(1, p6.total)}%"></i></div>
     <div>${p6.done}/${p6.total} câu đã có phán quyết · <b>${p6.reviewed}</b> duyệt · <b>${p6.excluded}</b> loại</div>
     <p class="small muted">Mỗi ý gồm bản VI + EN. Đối chiếu câu hỏi, đáp án, span bằng chứng với văn bản canonical và ảnh trang PDF; quét chọn văn bản để sửa span.</p>
     <div class="row">${badges(S.v206.validation, "")}</div></a>
   <a class="card" href="#/v219"><h3>V2-19 · Nhãn cấu trúc PDF</h3>
     <div class="muted small">${S.v219.manifest.corpus_version} · ${anns.length} file</div>
     <div class="bar"><i style="width:${100 * own / Math.max(1, anns.length)}%"></i></div>
     <div><b>${own}</b>/${anns.length} file owner đã xác nhận · ${wip} file đang duyệt dở</div>
     <p class="small muted">File chưa có <code>owner_confirmed</code> cần owner xem. Xem từng trang: ảnh bên trái, nhãn của trang bên phải; sửa/loại mục sai rồi <kbd>Enter</kbd> sang trang tiếp.</p>
     <div class="row">${badges(S.v219.validation, "")}</div></a>
   <div class="card small muted" style="grid-column:1/-1">Mọi thao tác ghi thẳng vào file dữ liệu; lần ghi đầu mỗi phiên lưu bản sao ở <code>local/backups/</code> của bộ dữ liệu. Tên người duyệt (góc phải) được ghi vào <code>reviewer_id</code>.</div>
  </div></div>`;
}

// ======================================================================== V2-06
async function loadV206() {
  S.v206 = await api("/api/v206");
  const d = S.v206;
  d.cps = {}; for (const [k, t] of Object.entries(d.texts)) d.cps[k] = t == null ? null : Array.from(t);
  d.spanById = Object.fromEntries(d.spans.map(s => [s.span_id, s]));
  const intents = new Map();
  for (const q of [...d.questions, ...d.excluded]) {
    if (!intents.has(q.intent_id)) intents.set(q.intent_id, []);
    intents.get(q.intent_id).push(q);
  }
  for (const qs of intents.values()) qs.sort((a, b) => a.lang === "vi" ? -1 : 1);
  d.intents = [...intents.entries()].map(([id, qs]) => ({id, qs}));
  d.audit = Object.fromEntries(d.negative_audit.map(a => [a.intent_id, a]));
}
async function act206(path, body, msg) {
  const j = await api(path, body);
  await loadV206(); renderV206(); renderBadges();
  if (msg) toast(msg);
  if (j.validation && !j.validation.structure.ok) toast("Validator: " + j.validation.structure.error, true);
  return j;
}
function qStatus(q) { return q.review_status; }
function curIntent() {
  const d = S.v206; const id = S.route[1] || d.intents[0]?.id;
  return d.intents.find(i => i.id === id) || d.intents[0];
}
function intentSets(intent) {
  const ans = intent.qs.filter(q => q.answerable && q.review_status !== "excluded");
  if (!ans.length) return {sets: null, ids: [], mismatch: false};
  const key = JSON.stringify(ans[0].evidence_sets);
  return {sets: ans[0].evidence_sets, ids: ans.map(q => q.id), mismatch: ans.some(q => JSON.stringify(q.evidence_sets) !== key)};
}
function renderV206() {
  const d = S.v206, it = curIntent();
  const filter = S.ui.v206filter || "all";
  const list = d.intents.filter(i => filter === "all" || i.qs.some(q => q.review_status === "draft"));
  const side = `<div class="tools"><label><input type="checkbox" id="f206" ${filter === "todo" ? "checked" : ""}> Chỉ ý còn nháp</label></div>` +
    list.map(i => {
      const q0 = i.qs[0];
      return `<a class="item ${i === it ? "on" : ""}" href="#/v206/${encodeURIComponent(i.id)}">
       <div class="t">${esc(i.id)}</div>
       <div class="m">${i.qs.map(q => `<span class="dot ${q.review_status}" title="${q.lang}: ${q.review_status}"></span>${q.lang.toUpperCase()}`).join(" ")}
        <span class="badge ${q0.split === "test" ? "acc" : ""}">${q0.split}</span>${q0.answerable ? "" : `<span class="badge warn">câu âm</span>`}<span class="badge">nguồn ${q0.corpus_lang.toUpperCase()}</span></div></a>`;
    }).join("");
  const p = v206Progress();
  $("#main").innerHTML = `<aside class="side"><div class="grp">${p.done}/${p.total} câu có phán quyết</div>${side}</aside>
   <section class="col pane" style="width:min(560px,42vw);flex:none" id="qpane"></section>
   <section class="col" style="flex:1;border-left:1px solid var(--line)" id="viewer"></section>`;
  $("#f206").onchange = e => { S.ui.v206filter = e.target.checked ? "todo" : "all"; renderV206(); };
  if (!it) return;
  renderQPane(it);
  if (!S.ui.docId || S.ui.intentShown !== it.id) {
    const es = intentSets(it).sets; const first = es?.[0]?.[0] && d.spanById[es[0][0]];
    S.ui.docId = first ? first.doc_id : (S.ui.docId || d.manifest.documents[0].doc_id);
    S.ui.focusSpan = first ? first.span_id : null; S.ui.intentShown = it.id; S.ui.page = first?.pages?.[0];
  }
  renderViewer(it);
}
function spanColor(intent) {
  const m = {}; let k = 0;
  for (const es of intentSets(intent).sets || []) for (const sid of es) if (!(sid in m)) m[sid] = k++ % 4;
  return m;
}
function renderQPane(it) {
  const d = S.v206, {sets, ids, mismatch} = intentSets(it), colors = spanColor(it);
  const audit = d.audit[it.id] || {};
  let h = `<div class="row" style="margin-bottom:10px"><h2 style="margin:0;font-size:16px">${esc(it.id)}</h2><span class="spacer"></span>
    <button class="ok" id="approveAll" title="Duyệt mọi câu nháp của ý này (A)">✓ Duyệt cả cặp <kbd>A</kbd></button>
    <button id="prevI">← <kbd>K</kbd></button><button id="nextI"><kbd>J</kbd> →</button></div>`;
  if (sets) {
    h += `<div class="card"><h3>Bằng chứng <span class="small muted">(các bộ là OR; span trong một bộ là AND)</span></h3>
      ${mismatch ? `<div class="badge bad">Các câu trong ý này đang có evidence_sets khác nhau; sửa ở đây sẽ áp dụng chung.</div>` : ""}
      ${sets.map((es, i) => `<div class="eset"><div class="hd">Bộ ${i + 1} — cần đủ tất cả <span class="spacer"></span>
        ${sets.length > 1 ? `<button class="sm ghost" data-delset="${i}">xoá bộ</button>` : ""}</div>
        ${es.map(sid => { const s = d.spanById[sid]; return `<div class="span c${colors[sid]}" data-focus="${esc(sid)}">
          <div class="q">“${esc(s?.quote)}”<div class="id">${esc(sid)} · ${esc(s?.doc_id)} · trang ${esc((s?.pages || []).join(",") || "—")} · [${s?.start_char}, ${s?.end_char})</div></div>
          <button class="sm ghost" data-rmspan="${i}|${esc(sid)}" title="Bỏ span khỏi bộ">✕</button></div>`; }).join("")}
        </div>`).join("")}
      <div class="help">Sửa span: quét chọn văn bản ở khung bên phải → chọn “thay” / “thêm vào bộ” / “bộ OR mới”.</div></div>`;
  } else {
    h += `<div class="card small"><b>Câu âm</b> — không có bằng chứng. Hãy xác nhận corpus thực sự không trả lời được (dùng ô tìm kiếm bên phải).</div>`;
  }
  for (const q of it.qs) {
    const ex = q.review_status === "excluded";
    const rv = d.reviews.find(r => r.question_id === q.id);
    h += `<div class="card status-${q.review_status}" data-q="${esc(q.id)}">

    return `<a class="item ${x.doc_id === id ? "on" : ""}" href="#/v219/${x.doc_id}"><div class="t"><span class="dot ${st}"></span> ${esc(x.doc_id)}</div>
      <div class="m"><span>${x.lang}</span><span>${np === 1 && isMd(x.doc_id) ? "md" : np + " tr"}</span>${x.expected_outcome === "FAILED" ? `<span class="badge bad">scan</span>` : ""}
      ${st === "wip" ? `<span class="badge warn">${dr.pages_done.length}/${np} trang</span>` : st === "reviewed" ? `<span class="badge ok">owner ✓</span>` : ""}
</div></a>`;
  }).join("")).join("");
  $("#main").innerHTML = `<aside class="side">${side}</aside>
    <section class="col" style="flex:1;display:flex;flex-direction:column" id="pview"></section>
    <section class="col" style="width:min(460px,36vw);flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column" id="lpane"></section>`;
  renderPage(id, page);
}
function goPage(id, p) { location.hash = `#/v219/${id}/${p}`; }
function renderPage(id, page) {
  const d = S.v219, meta = docMeta(id), rec = d.byId[id], dr = getDraft(id), pages = pagesOf(id);
  const counts = {}; for (const p of pages) counts[p] = itemsOnPage(dr, p).length;
  const hasImg = d.previews[id].includes(page);
  $("#pview").innerHTML = `<div class="vbar"><b>${esc(id)}</b><span class="small muted">${esc(meta.family)} · ${meta.lang} · ${esc(meta.license)}</span>
      <span class="badge ${meta.expected_outcome === "FAILED" ? "bad" : ""}">${esc(meta.expected_outcome)}${rec.expected_reason ? " · " + esc(rec.expected_reason) : meta.expected_warning ? " · " + esc(meta.expected_warning) : ""}</span>
      <span class="spacer"></span>${page !== "md" ? `<button class="sm" id="zoom">phóng</button><a class="small" target="_blank" href="/pdf/${id}.pdf#page=${page}">mở PDF trang ${page} ↗</a>` : ""}</div>
    <div class="vbar"><div class="pages">${pages.map(p => `<button data-p="${p}" class="${p === page ? "cur" : ""} ${dr.pages_done.includes(p) ? "done" : ""}">${p === "md" ? "toàn file" : p}${counts[p] ? `<span class="n">${counts[p]}</span>` : ""}</button>`).join("")}</div></div>
    <div class="vimg">${page === "md" ? `<pre class="md">${esc(d.markdown[id] || "(thiếu file markdown local)")}</pre>` :
      hasImg ? `<img src="/img/${id}/${page}" id="pimg" class="${S.ui.zoom ? "zoom" : ""}">` :
      `<iframe src="/pdf/${id}.pdf#page=${page}" style="width:100%;height:100%;border:0"></iframe>`}</div>`;
  $("#pview").querySelectorAll("[data-p]").forEach(b => b.onclick = () => goPage(id, b.dataset.p === "md" ? "md" : +b.dataset.p));
  const zm = $("#zoom"); if (zm) zm.onclick = () => { S.ui.zoom = !S.ui.zoom; $("#pimg")?.classList.toggle("zoom", S.ui.zoom); };
  renderLabels(id, page);
}
function itemBody(k, it) {
  if (k === "headings") return `<span class="badge acc">H${it.level}</span> ${esc(it.text)}`;
  if (k === "tables") return `<span class="badge acc">${it.rows}×${it.cols}</span> <span class="small muted">${esc(it.annotation_scope || "")}</span><div class="small">${(it.column_titles || []).map(esc).join(" │ ")}</div>${(it.cell_spans || []).length ? `<div class="small muted">ô gộp: ${it.cell_spans.map(s => `r${s.row}c${s.col}${s.rowspan > 1 ? " ↓" + s.rowspan : ""}${s.colspan > 1 ? " →" + s.colspan : ""}`).join(", ")}</div>` : ""}`;
  if (k === "furniture") return esc(it.text);
  return `<span class="badge">${it.kind === "within_document" ? "trong tài liệu" : "giữa tài liệu"}</span> ${esc(it.text)}${it.location ? ` <span class="small muted">@ ${esc(it.location)}</span>` : ""}`;
}
function itemEditor(k, it) {
  const pg = `<label>trang</label><input data-e="page" type="number" value="${it.page ?? ""}">`;
  if (k === "headings") return `<label>chữ</label><input data-e="text" value="${esc(it.text)}"><label>cấp</label><select data-e="level">${[1, 2, 3, 4, 5, 6].map(n => `<option ${n === it.level ? "selected" : ""}>${n}</option>`).join("")}</select>${pg}`;
  if (k === "tables") return `<label>hàng × cột</label><span><input data-e="rows" type="number" style="width:70px" value="${it.rows}"> × <input data-e="cols" type="number" style="width:70px" value="${it.cols}"></span>
    <label>tiêu đề cột<br><span class="muted">mỗi dòng 1 cột</span></label><textarea data-e="column_titles" rows="${Math.max(2, (it.column_titles || []).length)}">${esc((it.column_titles || []).join("\n"))}</textarea>
    <label>ô gộp<br><span class="muted">row,col,rowspan,colspan; …</span></label><input data-e="cell_spans" value="${esc((it.cell_spans || []).map(s => [s.row, s.col, s.rowspan, s.colspan].join(",")).join("; "))}">
    <label>phạm vi</label><input data-e="annotation_scope" value="${esc(it.annotation_scope || "")}" list="scopes">${pg}`;
  if (k === "furniture") return `<label>chữ</label><input data-e="text" value="${esc(it.text)}">${pg}`;
  return `<label>loại</label><select data-e="kind"><option value="within_document" ${it.kind === "within_document" ? "selected" : ""}>trong tài liệu</option><option value="between_documents" ${it.kind === "between_documents" ? "selected" : ""}>giữa tài liệu</option></select>
    <label>chữ</label><input data-e="text" value="${esc(it.text)}"><label>vị trí</label><input data-e="location" value="${esc(it.location || "")}">${pg}`;
}
function parseEdit(k, field, val) {
  if (field === "page") return val === "" ? null : +val;
  if (field === "level" || field === "rows" || field === "cols") return +val;
  if (field === "column_titles") return val.split("\n").map(s => s.trim()).filter(Boolean);
  if (field === "cell_spans") return val.split(";").map(s => s.trim()).filter(Boolean).map(s => { const [row, col, rowspan, colspan] = s.split(",").map(x => +x.trim()); return {row, col, rowspan: rowspan || 1, colspan: colspan || 1}; });
  return val;
}
function blankItem(k, page) {
  const p = pageKey(page);
  if (k === "headings") return {text: "", level: 1, page: p};
  if (k === "tables") return {page: p, rows: 1, cols: 1, column_titles: [], cell_spans: [], annotation_scope: "full_table"};
  if (k === "furniture") return {page: p, text: ""};
  return {page: p, kind: "within_document", text: "", location: ""};
}
function hlNotes(t) { return esc(t).replace(/KHÔNG CHẮC|Chưa kiểm|chưa kiểm/g, m => `<mark>${m}</mark>`); }
function renderLabels(id, page) {
  const d = S.v219, rec = d.byId[id], dr = getDraft(id), pages = pagesOf(id), on = itemsOnPage(dr, page);
  const open = S.ui.editing || {};
  let h = `<div class="col pane" style="flex:1">`;
  h += `<details class="card" ${(S.ui.docOpen ?? page === pages[0]) ? "open" : ""} id="docdet"><summary><b>Thông tin file</b> <span class="small muted">metadata, ghi chú agent</span></summary>
    <div class="lbl">Metadata kỳ vọng ${dr.metadata_d === "reject" ? `<span class="badge bad">đã bỏ</span>` : ""}</div>
    <div class="lab ${dr.metadata_d ? "d-" + dr.metadata_d : ""}"><div class="acts"><button class="sm" id="mOk">✓</button><button class="sm" id="mRej">✗</button></div>
      <div class="edit" style="grid-template-columns:110px 1fr">${["doc_code", "revision", "issued_date", "effective_date", "revision_date"].filter(k => k in dr.metadata || ["doc_code", "revision", "issued_date"].includes(k)).map(k => `<label>${k}</label><input data-m="${k}" value="${esc(dr.metadata[k] || "")}">`).join("")}</div></div>
    <div class="small muted">Trống = không có. Ngày theo YYYY-MM-DD.</div>
    ${rec.coverage_note ? `<div class="lbl">Phạm vi</div><div class="small">${esc(rec.coverage_note)}</div>` : ""}
    ${rec.review_notes ? `<div class="lbl">Ghi chú của ${esc(rec.reviewer_id || "agent")} (đọc kỹ chỗ <mark>KHÔNG CHẮC</mark>)</div><div class="notes">${hlNotes(rec.review_notes)}</div>` : ""}
    ${v219Owner(rec) ? `<div class="lbl"><span class="badge ok">owner đã xác nhận</span> ${esc(rec.reviewer_id)} · ${esc(rec.reviewed_at)}</div>` : ""}
  </details>`;
  h += `<div class="row"><h3 style="margin:4px 0;font-size:15px">${page === "md" ? "Toàn file" : "Trang " + page}</h3><span class="small muted">${on.length} nhãn</span>${dr.pages_done.includes(page) ? `<span class="badge ok">đã xem</span>` : ""}</div>`;
  if (!on.length) h += `<div class="small muted">Không có nhãn trên trang này${rec.expected_outcome === "FAILED" ? " (file kỳ vọng bị từ chối: chỉ cần xác nhận đây đúng là ảnh quét, không có lớp chữ)" : ""}. Nếu trang có heading/bảng/khung, thêm bên dưới.</div>`;
  for (const [k, label] of KINDS) {
    const its = on.filter(x => x[0] === k);
    h += `<div class="sec">${label} <span class="small muted">${its.length}</span><span class="spacer"></span><button class="sm" data-add="${k}">+ thêm</button></div>`;
    for (const [, i, it] of its) {
      const key = k + ":" + i, ed = open[key];
      h += `<div class="lab ${it._d ? "d-" + it._d : ""}" data-k="${k}" data-i="${i}"><div class="acts">
        <button class="sm" data-a="ok" title="Đúng">✓</button><button class="sm" data-a="edit" title="Sửa">✎</button><button class="sm" data-a="reject" title="Sai / bỏ">✗</button></div>
        <div class="body">${itemBody(k, it) || `<span class="muted">(trống)</span>`}${it._added ? ` <span class="badge acc">mới</span>` : ""}</div>
        ${ed ? `<div class="edit">${itemEditor(k, it)}</div>` : ""}</div>`;
    }
  }
  h += `<datalist id="scopes"><option>full_table<option>page_fragment<option>nested_table<option>continued</datalist>
    <div class="lbl">Ghi chú của owner cho file</div><textarea id="ownNotes" rows="2" placeholder="Tuỳ chọn">${esc(dr.notes || "")}</textarea></div>`;
  const allDone = pages.every(p => dr.pages_done.includes(p));
  const undecided = Object.values(dr.items).flat().filter(x => !x._d).length;
  h += `<div class="footer"><button class="primary" id="pageOk">✓ Trang đúng → tiếp <kbd>Enter</kbd></button>
    <button id="prevP"><kbd>←</kbd></button><button id="nextP"><kbd>→</kbd></button><span class="small muted">${dr.pages_done.length}/${pages.length} trang</span><span class="spacer"></span>
    <button class="ok" id="finish" ${allDone ? "" : "disabled"} title="${allDone ? "" : "Cần xem hết các trang"}">Hoàn tất file</button>
    <button class="sm ghost" id="discard" title="Bỏ toàn bộ quyết định đang dở của file này">bỏ nháp</button></div>`;
  const pane = $("#lpane"); pane.innerHTML = h;
  $("#docdet summary").onclick = () => { S.ui.docOpen = !$("#docdet").open; };
  const rer = () => { saveDraft(id); renderPage(id, page); };
  pane.querySelectorAll(".lab[data-k]").forEach(el => {
    const k = el.dataset.k, i = +el.dataset.i, it = dr.items[k][i], key = k + ":" + i;
    el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if (a === "edit") { S.ui.editing = {...open, [key]: !open[key]}; if (!it._added) it._d = "edit"; }
      else it._d = it._d === a ? undefined : a;
      if (it._added && a === "reject") { dr.items[k].splice(i, 1); S.ui.editing = {}; }
      rer();
    });
    el.querySelectorAll("[data-e]").forEach(inp => inp.onchange = () => {
      it[inp.dataset.e] = parseEdit(k, inp.dataset.e, inp.value); if (!it._added) it._d = "edit";
      if (inp.dataset.e === "page") S.ui.editing = {};
      rer();
    });
  });
  pane.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const k = b.dataset.add, it = blankItem(k, page); it._added = true; it._d = "ok";
    dr.items[k].push(it); S.ui.editing = {[k + ":" + (dr.items[k].length - 1)]: true}; rer();
  });
  pane.querySelectorAll("[data-m]").forEach(inp => inp.onchange = () => { dr.metadata[inp.dataset.m] = inp.value.trim(); dr.metadata_d = "edit"; rer(); });
  $("#mOk").onclick = () => { dr.metadata_d = dr.metadata_d === "ok" ? null : "ok"; rer(); };
  $("#mRej").onclick = () => { dr.metadata_d = dr.metadata_d === "reject" ? null : "reject"; rer(); };
  $("#ownNotes").onchange = e => { dr.notes = e.target.value; saveDraft(id); };
  $("#pageOk").onclick = () => pageDone(id, page);
  $("#prevP").onclick = () => { const i = pages.indexOf(page); if (i > 0) goPage(id, pages[i - 1]); };
  $("#nextP").onclick = () => { const i = pages.indexOf(page); if (i < pages.length - 1) goPage(id, pages[i + 1]); };
  $("#discard").onclick = async () => {
    if (!confirm("Bỏ mọi quyết định đang dở của " + id + "?")) return;
    delete S.v219.drafts[id]; await api("/api/v219/draft", {doc_id: id, draft: null}); renderV219();
  };
  $("#finish").onclick = () => finishDoc(id, undecided);
}
function pageDone(id, page) {
  const dr = getDraft(id), pages = pagesOf(id);
  for (const [, , it] of itemsOnPage(dr, page)) if (!it._d) it._d = "ok";
  if (!dr.pages_done.includes(page)) dr.pages_done.push(page);
  S.ui.editing = {}; saveDraft(id);
  const next = pages.slice(pages.indexOf(page) + 1).find(p => !dr.pages_done.includes(p)) ?? pages.find(p => !dr.pages_done.includes(p));
  if (next !== undefined) goPage(id, next); else { renderV219(); toast("Đã xem hết trang. Bấm “Hoàn tất file”."); }
}
async function finishDoc(id, undecided) {
  if (!reviewer()) return toast("Nhập tên người duyệt ở góc phải.", true);
  const dr = getDraft(id);
  if (!dr.metadata_d && Object.keys(dr.metadata).some(k => dr.metadata[k])) dr.metadata_d = "ok";
  const nRej = Object.values(dr.items).flat().filter(x => x._d === "reject" && !x._added).length;
  const nEdit = Object.values(dr.items).flat().filter(x => x._d === "edit").length;
  const nAdd = Object.values(dr.items).flat().filter(x => x._added).length;
  if (!confirm(`Ghi xác nhận owner cho ${id}?\n${nRej} mục bị bỏ, ${nEdit} mục sửa, ${nAdd} mục thêm.${undecided ? `\n${undecided} mục chưa đánh dấu sẽ tính là đúng.` : ""}`)) return;
  await api("/api/v219/draft", {doc_id: id, draft: dr});
  const j = await api("/api/v219/finish", {doc_id: id, reviewer_id: reviewer(), notes: dr.notes || ""});
  S.v219 = j.state; S.v219.byId = Object.fromEntries(S.v219.annotations.map(a => [a.doc_id, a]));
  toast("Đã xác nhận " + id); renderBadges();
  if (!j.state.validation.structure.ok) toast("Validator: " + j.state.validation.structure.error, true);
  const nxt = S.v219.manifest.documents.find(x => docStatus(x.doc_id) !== "reviewed");
  location.hash = nxt ? "#/v219/" + nxt.doc_id : "#/v219/" + id;
  if (!nxt) renderV219();
}

// ======================================================================== keys
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSel();
  if (inField(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  const r = S.route[0];
  if (r === "v206") {
    if (e.key === "j") S.ui.go206?.(1);
    else if (e.key === "k") S.ui.go206?.(-1);
    else if (e.key === "a") $("#approveAll")?.click();
    else if (e.key === "/") { e.preventDefault(); $("#search")?.focus(); }
  } else if (r === "v219") {
    if (e.key === "Enter") { e.preventDefault(); $("#pageOk")?.click(); }
    else if (e.key === "ArrowRight") $("#nextP")?.click();
    else if (e.key === "ArrowLeft") $("#prevP")?.click();
  }
});
route();
</script>
</body>
