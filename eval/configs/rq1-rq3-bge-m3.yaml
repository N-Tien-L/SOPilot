# V2-07 official RQ1/RQ1b/RQ2/RQ3 on sop-main (docproc chunks, span gold). Needs: uv sync --extra local
# Revisions pinned to HF commit hashes (checked 2026-10-20, V2-05). Change only together with the report.
# Run: python -m sopilot_eval.run --dataset datasets/sop-main --config configs/rq1-rq3-bge-m3.yaml --split dev|test --repeats 3
chunking:
  mode: docproc                      # sopilot_ai.docproc, target 384 / max 512 tokens of the model tokenizer
  target_tokens: 384
  max_tokens: 512
  structured_dir: results/extraction-clean/structured   # cached Docling extraction (byte-checked vs corpus)
  pilot_dataset: datasets/sop-pilot                      # Markdown sources of the two GitLab pages
configs:
  - {name: dense,           retriever: dense,  k: 5, embedder: &e {provider: sentence-transformers, model: BAAI/bge-m3, revision: 5617a9f61b028005a4858fdac845db406aefb181}}
  - {name: bm25,            retriever: bm25,   k: 5, embedder: *e}
  - {name: hybrid,          retriever: hybrid, k: 5, embedder: *e, weights: [1.0, 1.0]}
  - {name: hybrid-legacy-w, retriever: hybrid, k: 5, embedder: *e, weights: [0.7, 0.3]}
  # RQ1b: cross_lingual_bm25_factor candidates (TECH-V2-ai-service §6.4); chosen on dev, reported on test
  - {name: hybrid-xl0.3,    retriever: hybrid, k: 5, embedder: *e, weights: [1.0, 1.0], cross_lingual_bm25_factor: 0.3}
  - {name: hybrid-xl0,      retriever: hybrid, k: 5, embedder: *e, weights: [1.0, 1.0], cross_lingual_bm25_factor: 0.0}
