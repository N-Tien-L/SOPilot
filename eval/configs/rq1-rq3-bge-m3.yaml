# RQ1 (retriever), RQ2 (rerank), RQ3 (refusal sweep in report). Needs: uv sync --extra local
# Revisions pinned to HF commit hashes (checked 2026-10-20, V2-05). Change only together with the report.
chunking: {size: 800, overlap: 100}
configs:
  - {name: dense,           retriever: dense,  k: 5, embedder: &e {provider: sentence-transformers, model: BAAI/bge-m3, revision: 5617a9f61b028005a4858fdac845db406aefb181}}
  - {name: bm25,            retriever: bm25,   k: 5, embedder: *e}
  - {name: hybrid,          retriever: hybrid, k: 5, embedder: *e, weights: [1.0, 1.0]}
  - {name: hybrid-legacy-w, retriever: hybrid, k: 5, embedder: *e, weights: [0.7, 0.3]}
  - name: hybrid-rerank
    retriever: hybrid
    k: 5
    embedder: *e
    rerank: {model: BAAI/bge-reranker-v2-m3, revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
