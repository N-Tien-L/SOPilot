# V2-37 answer-evaluation configurations (dev: choose gate thresholds; test: the three reported runs).
# Rerank is the Modal reranker (same container as the answer model). Needs SOPILOT_RERANK_BASE_URL and
# SOPILOT_LLM_API_KEY in the environment. Run: python -m sopilot_eval.answers answers --config configs/answers-matrix.yaml --name <name>
chunking:
  mode: docproc
  target_tokens: 384
  max_tokens: 512
  structured_dir: results/extraction-clean/structured
  pilot_dataset: datasets/sop-pilot
configs:
  - {name: dense, retriever: dense, k: 5, embedder: &e {provider: sentence-transformers, model: BAAI/bge-m3, revision: 5617a9f61b028005a4858fdac845db406aefb181}}
  - {name: hybrid, retriever: hybrid, k: 5, embedder: *e, weights: [1.0, 1.0]}
  - name: dense-rerank
    retriever: dense
    k: 5
    embedder: *e
    rerank: &r {provider: modal, model: BAAI/bge-reranker-v2-m3, revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e, timeout_s: 600}
  - {name: hybrid-rerank, retriever: hybrid, k: 5, embedder: *e, weights: [1.0, 1.0], rerank: *r}
