[project]
name = "sopilot-eval"
version = "0.1.0"
description = "Reproducible retrieval evaluation harness for SOPilot (PRD-V2 FR-18)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6", "pypdf>=4"]

[project.optional-dependencies]
local = ["sentence-transformers>=3", "torch"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["sopilot_eval"]
