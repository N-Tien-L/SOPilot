name: Poliwise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, feedback-service, knowledge-service, metadata-service, user-service]
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build and Test
      run: |
        cd services/${{ matrix.service }}
        chmod +x mvnw
        if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
        ./mvnw verify -B

  backend-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-qa-service, ingestion-service]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Test with pytest
      run: |
        cd services/${{ matrix.service }}
        if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
        uv sync --extra dev
        uv run pytest

  frontend-and-gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend/web, services/api-gateway]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pnpm
      run: corepack enable && corepack prepare pnpm@10.32.1 --activate
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install dependencies and Build
      run: |
        cd ${{ matrix.app }}
        pnpm install --frozen-lockfile
        pnpm build
