name: Tenant isolation (FR-19)

# V2-14: zero cross-workspace leakage, proven on every pull request. Docker is preinstalled on
# ubuntu-latest; the suites start their own disposable pgvector Postgres (no .env, no named volume).
on:
  pull_request:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three workspaces, both application roles, every tenant table of core and rag found from the catalog.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Database isolation suite
        working-directory: tests/tenant-isolation
        run: |
          uv sync
          uv run pytest -v

  # The suite must be able to fail: switch RLS off on every tenant table and require a red run.
  # If this job passes the suite, the suite is not looking at anything.
  negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Isolation suite with RLS disabled must FAIL
        working-directory: tests/tenant-isolation
        run: |
          uv sync
          if ISOLATION_MUTATION=disable-rls uv run pytest -q; then
            echo "::error::The isolation suite passed with RLS disabled, so it cannot detect a leak."
            exit 1
          fi
          echo "Suite failed with RLS disabled, as required."

  # HTTP API: three workspaces with secrets in every kind of data; forged tokens; one pooled connection.
  core-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tenant isolation tests of core-api
        working-directory: services/core-api
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test='TenantIsolationIT,TenantIsolationApiIT'

  # Retrieval & QA: access filter, conversations, citations and delete never cross workspaces;
  # a reopened answer generated from a no-longer-readable document stays hidden (TECH-V2-ai-service §7.5).
  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Retrieval and QA isolation tests of ai-service
        working-directory: services/ai-service
        run: |
          uv sync --extra dev
          uv run pytest tests/integration/test_retrieval.py tests/integration/test_qa_isolation.py \
            tests/integration/test_feedback_isolation.py \
            "tests/integration/test_qa_api.py::test_reopened_answer_is_hidden_when_a_cited_document_is_no_longer_readable" \
            "tests/integration/test_qa_api.py::test_reopened_answer_without_citations_is_hidden_when_a_source_is_no_longer_readable" \
            "tests/integration/test_qa_api.py::test_citation_to_an_older_version_keeps_its_snippet_and_is_marked" -v

  # V2-26 / FR-29: inside ONE workspace, a document limited to departments never reaches someone
  # outside them. Separate from the FR-19 jobs above so a failure names the layer that broke
  # (ADR-007 §4.4-§4.5). Each half starts its own disposable Postgres; no service runs the other.
  department-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Department authorization tests of core-api
        working-directory: services/core-api
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test='DepartmentAuthorizationIT'
      - name: Department authorization tests of ai-service
        working-directory: services/ai-service
        run: |
          uv sync --extra dev
          uv run pytest tests/integration/test_department_authorization.py -v
