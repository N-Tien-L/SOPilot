[project]
name = "sopilot-ai-service"
version = "0.1.0"
description = "SOPilot V2 AI service: document processing, retrieval and question answering (ADR-004, TECH-V2-ai-service)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "markdown-it-py>=3.0",
    "numpy>=1.26",
    # API, database and worker (V2-09)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "minio>=7.2",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# PDF adapter (ADR-008). Runtime depends on exactly one PDF library; OCR stays off.
pdf = ["docling==2.142.1"]
# Tokenizer of the active embedding model for the chunker (V2-22); weights are not loaded.
tokenizer = ["transformers>=4.40"]
# Local embedding provider (sentence-transformers on CPU, TECH-V2-ai-service §4.3).
local = ["sentence-transformers>=3.0", "transformers>=4.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "hypothesis>=6.100", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker; starts a disposable pgvector Postgres with the real rag migrations",
    "pdf: needs the optional Docling dependency and model artifacts",
    "tokenizer: needs the optional transformers dependency and a cached embedding tokenizer",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# T20 (flake8-print): no print calls; log with structlog.
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false  # run from source via pytest pythonpath; nothing to build
