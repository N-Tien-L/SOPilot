# The only place that declares models (ADR-006 §4.1.2, TECH-V2-ai-service §4.2).
# ${VAR} and ${VAR:default} are expanded from the environment when the file is loaded.
embedding:
  active: bge-m3
  models:
    bge-m3:
      provider: local                  # local | cloudflare | openai_compatible
      model: BAAI/bge-m3
      revision: ${EMBEDDING_REVISION:}  # pin the HF commit; empty is a startup error in profile eval
      dim: 1024
      max_tokens: 8192
      query_prefix: ""
      batch_size: 16
rerank:
  enabled: ${RERANK_ENABLED:false}
  provider: ${RERANK_PROVIDER:local}   # local | modal | none (modal: POST {providers.modal.rerank_base_url}/rerank, V2-35)
  model: BAAI/bge-reranker-v2-m3
  revision: ${RERANK_REVISION:}
  max_pairs: 25
  timeout_s: ${RERANK_TIMEOUT_S:30}    # modal only; cold start of the GPU container can exceed this
llm:
  # Owner chốt 2026-11-01 (ADR-006 §4.4) and 2026-11-04 (V2-10): one self-hosted model behind an
  # OpenAI-compatible server (vLLM on Modal). No fallback chain yet; a second endpoint is added here
  # only when the owner asks for one. Model id, URL and key come from the environment.
  # rpm/tpm/context ceiling are our own server limits: placeholders until measured on the endpoint.
  generate:
    chain:
      - provider: modal
        model: "${SOPILOT_LLM_MODEL:}"
        rpm: "${SOPILOT_LLM_RPM:60}"
        tpm: "${SOPILOT_LLM_TPM:200000}"
        context_max_tokens: "${SOPILOT_LLM_CONTEXT_MAX_TOKENS:}"
        extra_body: {chat_template_kwargs: {enable_thinking: false}}
    temperature: 0.2
    max_output_tokens: 800
  rewrite:
    chain:
      - provider: modal
        model: "${SOPILOT_LLM_MODEL:}"
        rpm: "${SOPILOT_LLM_RPM:60}"
        tpm: "${SOPILOT_LLM_TPM:200000}"
        context_max_tokens: "${SOPILOT_LLM_CONTEXT_MAX_TOKENS:}"
        extra_body: {chat_template_kwargs: {enable_thinking: false}}
    temperature: 0
    max_output_tokens: 200
  # V2-25 metadata suggestions (TECH-V2-ai-service §5.7). Owner chose Groq for this task (2026-11-11);
  # the answer model stays on Modal. Model id is an env default so it can be changed without a code change.
  suggest:
    timeout_s: ${SOPILOT_SUGGEST_TIMEOUT_S:20}
    chain:
      - provider: groq
        model: "${SOPILOT_SUGGEST_MODEL:qwen/qwen3.8-27b}"
        rpm: "${SOPILOT_SUGGEST_RPM:30}"
        tpm: "${SOPILOT_SUGGEST_TPM:60000}"
        context_max_tokens: "${SOPILOT_SUGGEST_CONTEXT_MAX_TOKENS:}"
        extra_body: {reasoning_format: hidden}
    temperature: 0
    max_output_tokens: 400
providers:
  modal: {base_url: "${SOPILOT_LLM_BASE_URL:}", rerank_base_url: "${SOPILOT_RERANK_BASE_URL:}", api_key_env: SOPILOT_LLM_API_KEY}
  groq: {base_url: "${SOPILOT_GROQ_BASE_URL:https://api.groq.com/openai/v1}", api_key_env: SOPILOT_GROQ_API_KEY}
  # Embedding endpoints for the non-local providers (unused while bge-m3 runs locally).
  openai_compatible: {base_url: "${EMBEDDING_BASE_URL:http://tei:80/v1}", api_key_env: EMBEDDING_API_KEY}
  cloudflare: {base_url: "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:}/ai/run", api_key_env: CLOUDFLARE_API_TOKEN}
retrieval:
  candidate_pool: 50
  rerank_pool: 25
  context_k: 5
  rrf_k: 60
  rrf_weights: [1.0, 1.0]
  doc_code_boost: 0.02
  cross_lingual_bm25_factor: 1.0
  context:
    expand: true
    section_max_tokens: 1200
    max_tokens: 3000
  thresholds:            # placeholders until calibrated on the V2-06 dev set (V2-07)
    dense: 0.45
    bm25: null
    hybrid: 0.45
    hybrid_rerank: 0.30
  mode: hybrid
chunking:
  target_tokens: 384
  max_tokens: 512
  min_tokens: 64
