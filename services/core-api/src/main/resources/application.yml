# core-api (TECH-V2-core-api §9). Secrets come from env (.env); do not put real values here.
# No profile is active by default: without `local`/`test` there is no dev login and no
# generated signing key, so a missing key fails startup instead of running insecurely.
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Read (and discard) an oversized upload instead of resetting the connection, so the client
    # receives 413 FILE_TOO_LARGE. Slightly above spring.servlet.multipart.max-request-size.
    max-swallow-size: 22MB
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: core-api
  datasource:
    url: ${SOPILOT_DB_URL:jdbc:postgresql://localhost:55432/sopilot}
    username: ${SOPILOT_DB_USER:sopilot_core_app}
    password: ${SOPILOT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${SOPILOT_DB_POOL_SIZE:10}
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # 20 MB per file (FR-06); the service re-checks the size and answers 413 FILE_TOO_LARGE.
      max-file-size: 20MB
      max-request-size: 21MB

sopilot:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    jwks-cache-ttl: PT1H
  jwt:
    private-key-path: ${SOPILOT_JWT_PRIVATE_KEY_PATH:}
    kid: ${SOPILOT_JWT_KID:}
    access-ttl: ${SOPILOT_ACCESS_TTL:PT15M}
    generate-if-missing: false
  auth:
    nonce-hmac-key: ${SOPILOT_NONCE_HMAC_KEY:}
    nonce-ttl: PT5M
    allow-ephemeral-nonce-key: false
    cookie-secure: true

  internal:
    # One token for both directions between core-api and ai-service. Blank rejects every /internal call.
    token: ${SOPILOT_INTERNAL_TOKEN:}
    ai-base-url: ${SOPILOT_AI_BASE_URL:http://ai-service:8000}
  s3:
    endpoint: ${SOPILOT_S3_ENDPOINT:}
    bucket: ${SOPILOT_S3_BUCKET:}
    access-key: ${SOPILOT_S3_ACCESS_KEY:}
    secret-key: ${SOPILOT_S3_SECRET_KEY:}
    region: ${SOPILOT_S3_REGION:us-east-1}
  quota:
    # FR-09 (owner, 2026-10-21): 50 documents / 200 MB per workspace; 0 turns a limit off.
    docs-per-workspace: ${SOPILOT_QUOTA_DOCS_PER_WORKSPACE:50}
    bytes-per-workspace: ${SOPILOT_QUOTA_BYTES_PER_WORKSPACE:209715200}
  outbox:
    enabled: true
    poll: ${SOPILOT_OUTBOX_POLL:PT5S}
    max-attempts: ${SOPILOT_OUTBOX_MAX_ATTEMPTS:20}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
