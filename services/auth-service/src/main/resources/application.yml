server:
  port: 8081

spring:
  application:
    name: auth-service
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
    username: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
    password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    virtual-host: ${RABBITMQ_VHOST:/}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:change-me-in-production}
    issuer: ${AUTH_JWT_ISSUER:poliwise-auth-service}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P7D}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${AUTH_LOCK_DURATION:PT15M}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:sopilot-google-client-id}
      jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      jwks-cache-ttl-minutes: ${GOOGLE_JWKS_CACHE_TTL_MINUTES:60}

app:
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}

poliwise:
  service-token: ${INTERNAL_SERVICE_TOKEN:poliwise_internal_token_secret}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
