server:
  port: 8085

poliwise:
  jwt:
    secret: ${POLIWISE_JWT_SECRET:change-me-in-production}
    issuer: ${POLIWISE_JWT_ISSUER:poliwise-auth-service}
  internal-api-key: ${INTERNAL_API_KEY:change-me-in-production}

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
    username: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
    password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    virtual-host: ${RABBITMQ_VHOST:/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
